name: vimbo

services:
  api:
    build:
      context: ./docker/php
    container_name: vimbo-api
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      LOCALES_DIR: /srv/data/locales
    volumes:
      - ./api:/srv/app
      - ./data:/srv/data:ro
    command:
      - sh
      - -c
      - >-
        [ -f vendor/autoload.php ] || composer install --no-dev --no-interaction
        --optimize-autoloader --no-progress;
        exec php-fpm
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(is_file(\"/srv/app/vendor/autoload.php\") ? 0 : 1);'"]
      start_period: 90s
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [vimbonet]

  video:
    build:
      context: ./docker/node
    container_name: vimbo-video
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CACHE_DIR: /srv/cache
      CLIPS_DIR: /srv/clips
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
    volumes:
      - ./video:/srv/app
      - ./storage/cache:/srv/cache
      - ./storage/clips:/srv/clips
    command:
      - sh
      - -c
      - >-
        npm install --omit=dev --no-audit --no-fund &&
        node src/server.js
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/video/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [vimbonet]

  web:
    image: nginx:1.27-alpine
    container_name: vimbo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      video:
        condition: service_healthy
    ports:
      - "8087:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/srv/app/public:ro
      - ./web/dist:/srv/web:ro
    networks: [vimbonet]

networks:
  vimbonet:
    driver: bridge
